<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h1>Create an Account</h1>
        <hr>
        <form action="sucessive.html" onsubmit="return valid()">
            <div>
                <label for="">Full Name <span>*</span></label>
                <br>
                <input type="text" name="" id="FullName">
            
                <p id="FullNameid"></p>
            

            </div>
            
            <div>
                <label for="">Email <span>*</span><label>
                <br>
                <input type="email" name="" id="email">
                <br>
                <p id="emailid"></p>

            </div>
            
            
            <label for="">Contact No. <span>*</span></label>
            <br>
            <input type="number" name="" id="contact">
            <p id="contactid"></p>
            <label for="">Password <span>*</span></label>
            <br>
            <input type="password" name="" id="Password">
            <p id="Passwordid"></p>
            <label for="">Confirm Password <span>*</span></label>
            <br>
            <input type="password" name="" id="confirmpassword">
            <p id="confirmpasswordid"></p>
            <button type="submit">Create Account</button>
            <br><br><br>

        </form>






    </div>
    <br><br>
    <script src="script.js"></script>
</body>
</html>
