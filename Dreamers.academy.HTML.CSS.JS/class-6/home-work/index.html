<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Submission</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <i class="title">Homework Submission</i>
        <br><br>
        <input class="w" type="text" placeholder="Student Name">
        <br><br>
        <input class="w" type="number" placeholder="Roll">
        <br><br>
        <input class="w" type="number" placeholder="Class/Grade">
        <br><br>
        <input class="w" type="email" placeholder="Parent's Email">
        <br><br>
        <h2>Subject</h2>
        
        <select class="select">
            <option>--Choose--</option>
            <option>--Math--</option>
            <option>--Bangla--</option>
            <option>--English--</option>
            <option>--Science--</option>
            <option>--History--</option>
            <option>--ICT--</option>
            <option>--Art--</option>
            <option>--Islam--</option>
            
        </select>
        <h2>Homework type</h2>
        <input class="rad" type="radio" name="radio">
        <lable>Assignment</lable>
        <input class="rad" type="radio" name="radio">
        <lable>Project</lable>
        <input class="rad" type="radio" name="radio">
        <label>Presentation</label>
        <h2>Upload Homework</h2>
        <input class="date" type="file">
        <h2>Submission Date</h2>
        <input class="f" type="date">
        <h2>Remarks</h2>
        <input class="text" type="text">
        <br><br>
        <button class="button" type="submit">Submit</button>

    </center>
    
    
</body>
</html>
