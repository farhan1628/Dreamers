<body>
    <div style="text-align: center;">
`       <h1 class="text-danger">Contact Us</h1>
        <h3 class="text-primary">We would love to hear from you!</h3>
        <h3 class="text-primary">Reach out to us using the form below:</h3>
    </div>
    <br><br>
    <form id="contact-form" action="mail.php" method="POST" style="width: 600px; margin: auto;">
    <div class="border" style="padding: 9px; border-radius: 5px;">
  <h2 class="text-success" style="text-align: center;">Get in touch</h2>
  <hr>

  <!-- Name input -->
   
  <div data-mdb-input-init class="form-outline mb-4">
    <b class="form-label" for="name">Name</b>
    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" />
    
  </div>

  <!-- Email input -->
  <div data-mdb-input-init class="form-outline mb-4">
    <b class="form-label" for="email">Email address</b>
    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"/>
    
  </div>

  
  <!-- Message input -->
  <div data-mdb-input-init class="form-outline mb-4">
    <b class="form-label" for="message">message</b>
    <textarea class="form-control" id="message" name="message" rows="4" placeholder="Your Message"></textarea>
    
  </div>

  <!-- Submit button -->
  <button data-mdb-button-init id="submit-form" type="submit" data-mdb-ripple-init class="btn btn-success btn-block mb-4" style="width: 570px;background-color:white; color: green;">
    Send Message
  </button>
</form>
</div>
</body>
